<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailer Planner Lite</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<style>
body{
    font-family:Arial;
    margin:10px;
}

input,select,button{
    padding:8px;
    margin:4px;
}

.store{
    border:1px solid #ddd;
    border-radius:8px;
    padding:8px;
    margin-bottom:8px;
}

.trailer{
    border:1px solid #666;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
}

.over{
    background:#ffd6d6;
}

.summary{
    background:#f5f5f5;
}
</style>
</head>

<body>

<h1>Trailer Planner Lite</h1>

<input type="file" id="file">

<button onclick="addTrailer()">
+ Add Trailer
</button>

<br>

<input
type="text"
id="search"
placeholder="Search Store # or Name"
onkeyup="drawStores()"
>

<hr>

<h2>Trailer Summary</h2>
<div id="trailers"></div>

<hr>

<h2>Stores</h2>
<div id="stores"></div>

<script>

let stores=[];

let trailerCount=4;

document.getElementById('file')
.addEventListener('change',loadFile);

function loadFile(e){

const file=e.target.files[0];

const reader=new FileReader();

reader.onload=function(evt){

const workbook=XLSX.read(
evt.target.result,
{type:'binary'}
);

const sheet=
workbook.Sheets[
workbook.SheetNames[0]
];

stores=XLSX.utils.sheet_to_json(sheet);

stores.forEach(x=>{
x.TRAILER="Unassigned";
});

drawStores();
drawTrailers();

};

reader.readAsBinaryString(file);

}

function addTrailer(){

trailerCount++;

drawStores();
drawTrailers();

}

function trailerOptions(current){

let html=
`<option
${current==="Unassigned"?"selected":""}
>
Unassigned
</option>`;

for(let i=1;i<=trailerCount;i++){

html+=`
<option
${current===("Trailer "+i)?
"selected":""
}>
Trailer ${i}
</option>`;
}

return html;
}

function drawStores(){

let search=
document
.getElementById('search')
.value
.toLowerCase();

let html="";

stores.forEach((s,index)=>{

let name=(s.NAME||"");
let store=(s["STORE #"]||"");
let address=(s.ADDRESS||"");

let match=
name.toLowerCase().includes(search)
||
String(store).includes(search);

if(!match) return;

html+=`
<div class="store">

<b>${name}</b>
<br>

Store # ${store}

<br>

Spaces:
${s.SPACES||0}

<br>

Weight:
${s.WEIGHT||0}

<br><br>

<select
onchange="
stores[${index}].TRAILER=this.value;
drawTrailers();
"
>
${trailerOptions(s.TRAILER)}
</select>

https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}
📍 Map
</a>

</div>
`;

});

document.getElementById('stores').innerHTML=html;

}

function drawTrailers(){

let html="";

for(let t=1;t<=trailerCount;t++){

let spaces=0;
let weight=0;
let count=0;

let trailerStores=stores.filter(
s=>s.TRAILER==="Trailer "+t
);

trailerStores.forEach(s=>{

spaces+=Number(s.SPACES)||0;

weight+=Number(s.WEIGHT)||0;

count++;

});

let over=
spaces>24 ||
weight>35000;

let storeList="";

trailerStores.forEach(s=>{

storeList+=`
<div style="
margin-left:10px;
padding:4px;
border-left:2px solid #ddd;
">
<b>${s.NAME}</b>
<br>
Store # ${s["STORE #"]}
<br>
Spaces: ${s.SPACES}
<br>
Weight: ${s.WEIGHT}
</div>
`;

});

let routeAddresses=
trailerStores
.map(s=>encodeURIComponent(s.ADDRESS))
.join("/");

let routeUrl=
"https://www.google.com/maps/dir/"
+
routeAddresses;

let farthestStore="";

if(trailerStores.length){

let sorted=[
...trailerStores
].sort(
(a,b)=>
(Number(b.WEIGHT)||0)
-
(Number(a.WEIGHT)||0)

);

farthestStore=
sorted[0].NAME;

}

html+=`

<div class="
trailer
summary
${over?"over":""}
">

<h3>Trailer ${t}</h3>

Stores: ${count}
<br>

Spaces:
${spaces.toFixed(1)}
/24

<br>

Weight:
${Math.round(weight)}
/35000 lbs

<br><br>

<b>Farthest Store:</b>
${farthestStore}

<br><br>

<a href="${routeUrl}" target="_blank">
🗺 Open Route
</a>

<hr>

${storeList}

</div>

`;

}

document.getElementById(
'trailers'
).innerHTML=html;

}







drawTrailers();

</script>

</body>
</html>
