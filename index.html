<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trailer Planner V3</title>
<style>
body{font-family:Arial;padding:10px}
button{margin:3px;padding:8px}
.trailer{
border:1px solid #999;
border-radius:8px;
padding:10px;
margin:8px 0;
}
.over{background:#ffd6d6}
</style>
</head>
<body>

<h2>Trailer Planner V3</h2>

<button onclick="addTrailer()">+ Add Trailer</button>

<div id="trailers"></div>

<script>
let trailers=[
{
name:'Trailer 1',
spaces:0,
weight:0,
limitS:24,
limitW:35000
}
];

function draw(){
document.getElementById('trailers').innerHTML=
trailers.map((t,i)=>`
<div class="trailer ${(t.spaces>t.limitS||t.weight>t.limitW)?'over':''}">
<b>${t.name}</b><br>
${t.spaces}/${t.limitS} spaces<br>
${t.weight}/${t.limitW} lbs<br><br>

<button onclick="copyTrailer(${i})">
Copy Trailer
</button>

<button onclick="removeTrailer(${i})">
Delete Trailer
</button>
</div>
`).join('');
}

function addTrailer(){
trailers.push({
name:'Trailer '+(trailers.length+1),
spaces:0,
weight:0,
limitS:24,
limitW:35000
});
draw();
}

function copyTrailer(i){
let t=JSON.parse(JSON.stringify(trailers[i]));
t.name='Trailer '+(trailers.length+1);
trailers.push(t);
draw();
}

function removeTrailer(i){
if(trailers.length>1){
trailers.splice(i,1);
draw();
}
}

draw();
</script>

</body>
</html>
