<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Trailer Planner Lite</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">\</script>

<style>

body{
    font-family:Arial,sans-serif;
    margin:10px;
    background:#f5f5f5;
}

.store{
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    padding:8px;
    margin-bottom:8px;
}

.trailer{
    background:white;
    border:1px solid #888;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
}

.over{
    background:#ffd6d6;
}

.storeItem{
    margin-left:10px;
    border-left:3px solid #ddd;
    padding-left:8px;
    margin-top:5px;
}

button,input,select{
    padding:8px;
    margin:4px;
}

</style>
</head>

<body>

<h1>Trailer Planner Lite</h1>

<input type="file" id="file">

<button onclick="addTrailer()">
+ Add Trailer
</button>

<br>

<input
type="text"
id="search"
placeholder="Search Store # or Name"
onkeyup="drawStores()"
>

<hr>

<h2>Unassigned Stores</h2>
<div id="unassigned"></div>

<hr>

<h2>Trailer Summary</h2>
<div id="trailers"></div>

<hr>

<h2>All Stores</h2>
<div id="stores"></div>

<script>

let stores=[];
let trailerCount=4;

document
.getElementById("file")
.addEventListener("change",loadFile);

function loadFile(e){

    const file=e.target.files[0];

    const reader=new FileReader();

    reader.onload=function(evt){

        const workbook=XLSX.read(
            evt.target.result,
            {type:"binary"}
        );

        const sheet=
        workbook.Sheets[
            workbook.SheetNames[0]
        ];

        stores=
        XLSX.utils.sheet_to_json(sheet);

        stores.forEach(s=>{
            s.TRAILER="Unassigned";
        });

        drawStores();
        drawTrailers();
    };

    reader.readAsBinaryString(file);
}

function addTrailer(){

    trailerCount++;

    drawStores();
    drawTrailers();
}

function trailerOptions(current){

    let html=
    `<option ${
    current==="Unassigned"
    ?"selected":""
    }>Unassigned</option>`;

    for(let i=1;i<=trailerCount;i++){

        html+=`
        <option ${
        current===("Trailer "+i)
        ?"selected":""
        }>
        Trailer ${i}
        </option>`;
    }

    return html;
}

function drawStores(){

    let search=
    document
    .getElementById("search")
    .value
    .toLowerCase();

    let allHtml="";
    let unassignedHtml="";

    stores.forEach((s,index)=>{

        let name=s.NAME || "";
        let store=s["STORE #"] || "";
        let address=s.ADDRESS || "";

        let match=
        name.toLowerCase().includes(search)
        ||
        String(store).includes(search);

        if(!match) return;

        let card=`

        <div class="store">

        <b>${name}</b><br>

        Store # ${store}<br>

        Spaces: ${s.SPACES || 0}<br>

        Weight: ${s.WEIGHT || 0}<br>

        Assigned To:
        ${s.TRAILER}

        <br><br>

        <select
        onchange="
        stores[${index}].TRAILER=this.value;
        drawStores();
        drawTrailers();
        "
        >
        ${trailerOptions(s.TRAILER)}
        </select>

        <a
        href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}"
        target="_blank"
        >
        📍 Map
        </a>

        </div>
        `;

        allHtml += card;

        if(s.TRAILER==="Unassigned"){
            unassignedHtml += card;
        }

    });

    document.getElementById("stores").innerHTML =
    allHtml;

    document.getElementById("unassigned").innerHTML =
    unassignedHtml;
}

function drawTrailers(){

    let html="";

    for(let t=1;t<=trailerCount;t++){

        let trailerStores=
        stores.filter(
        s=>s.TRAILER==="Trailer "+t
        );

        if(trailerStores.length===0){
            continue;
        }

        let spaces=0;
        let weight=0;

        trailerStores.forEach(s=>{

            spaces +=
            Number(s.SPACES) || 0;

            weight +=
            Number(s.WEIGHT) || 0;
        });

        let over=
        spaces>24 ||
        weight>35000;

        let remainingSpaces=
        (24-spaces).toFixed(1);

        let remainingWeight=
        Math.round(35000-weight);

        let details="";

        trailerStores.forEach(s=>{

            details += `
            <div class="storeItem">

            <b>${s.NAME}</b><br>

            Store # ${s["STORE #"]}<br>

            Spaces: ${s.SPACES}<br>

            Weight: ${s.WEIGHT}

            </div>
            `;
        });

        let route=
        "https://www.google.com/maps/dir/" +
        trailerStores
        .map(
        x=>
        encodeURIComponent(
        x.ADDRESS || ""
        )
        )
        .join("/");

        html += `

        <div class="
        trailer
        ${over ? "over" : ""}
        ">

        <h3>Trailer ${t}</h3>

        Stores:
        ${trailerStores.length}

        <br>

        Spaces:
        ${spaces.toFixed(1)}
        /24

        <br>

        Weight:
        ${Math.round(weight)}
        /35000 lbs

        <br><br>

        Remaining:

        <br>

        ${remainingSpaces}
        Spaces

        <br>

        ${remainingWeight}
        lbs

        <br><br>

        ${route}

        🗺 Open Route

        </a>

        <hr>

        ${details}

        </div>
        `;
    }

    document
    .getElementById("trailers")
    .innerHTML=html;
}

drawTrailers();

</script>

</body>
</html>
