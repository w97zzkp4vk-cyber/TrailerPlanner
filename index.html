<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Trailer Planner Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">\</script>

<style>

body{
    font-family:Arial,sans-serif;
    margin:10px;
    background:#f5f5f5;
}

button,input,select{
    padding:8px;
    margin:4px;
}

.store{
    background:white;
    border:1px solid #ddd;
    border-radius:8px;
    padding:8px;
    margin-bottom:8px;
}

.trailer{
    background:white;
    border:1px solid #888;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
}

.over{
    background:#ffd6d6;
}

.storeItem{
    margin-left:10px;
    border-left:3px solid #ddd;
    padding-left:8px;
    margin-top:5px;
}

.assistantGood{
    color:green;
    font-weight:bold;
}

.assistantWarn{
    color:red;
    font-weight:bold;
}

</style>
</head>

<body>

<h1>Trailer Planner Pro</h1>

<div class="trailer">

<h2>🚛 Route Assistant</h2>

<div id="assistantContent">

Upload a file to begin analysis.

</div>

</div>

<input type="file" id="file">

<button onclick="addTrailer()">
+ Add Trailer
</button>

<br>

<input
type="text"
id="search"
placeholder="Search Store # or Name"
onkeyup="drawStores()"
>

<hr>

<h2>Unassigned Stores</h2>

<div id="unassigned"></div>

<hr>

<h2>Trailers</h2>

<div id="trailers"></div>

<hr>

<h2>All Stores</h2>

<div id="stores"></div>

<script>

let stores=[];
let trailerCount=4;

document
.getElementById("file")
.addEventListener("change",loadFile);

function loadFile(e){

const file=e.target.files[0];

const reader=new FileReader();

 reader.onload=function(evt){

const workbook=XLSX.read(
evt.target.result,
{type:"binary"}
);

const sheet=
workbook.Sheets[
workbook.SheetNames[0]
];

stores=
XLSX.utils.sheet_to_json(sheet);

stores.forEach(s=>{
s.TRAILER="Unassigned";
});

drawStores();
drawTrailers();
drawAssistant();

};

reader.readAsBinaryString(file);

}

function addTrailer(){

trailerCount++;

drawStores();
drawTrailers();
drawAssistant();

}

function trailerOptions(current){

let html=
`<option ${
current==="Unassigned"
?"selected":""
}>Unassigned</option>`;

for(let i=1;i<=trailerCount;i++){

html+=`
<option ${
current===("Trailer "+i)
?"selected":""
}>
Trailer ${i}
</option>`;

}

return html;

}

function drawStores(){

let search=
document
.getElementById("search")
.value
.toLowerCase();

let allHtml="";
let unassignedHtml="";

stores.forEach((s,index)=>{

let name=s.NAME || "";
let store=s["STORE #"] || "";
let address=s.ADDRESS || "";

let match=
name.toLowerCase().includes(search)
||
String(store).includes(search);

if(!match){
return;
}

let card=`

<div class="store">

<b>${name}</b><br>

Store # ${store}<br>

Spaces: ${s.SPACES || 0}<br>

Weight: ${s.WEIGHT || 0}<br>

Assigned To:
${s.TRAILER}

<br><br>

<select
onchange="
stores[${index}].TRAILER=this.value;
drawStores();
drawTrailers();
drawAssistant();
"
>

${trailerOptions(s.TRAILER)}

</select>

"
target="_blank"
>

📍 Map

</a>

</div>

`;

allHtml+=card;

if(s.TRAILER==="Unassigned"){
unassignedHtml+=card;
}

});

document.getElementById(
"stores"
).innerHTML=allHtml;

document.getElementById(
"unassigned"
).innerHTML=unassignedHtml;

}

 function drawTrailers(){

let html="";

for(let t=1;t<=trailerCount;t++){

let trailerStores=
stores.filter(
s=>s.TRAILER==="Trailer "+t
);

if(trailerStores.length===0){
continue;
}

let spaces=0;
let weight=0;

trailerStores.forEach(s=>{

spaces+=Number(s.SPACES)||0;
weight+=Number(s.WEIGHT)||0;

});

let remainingSpaces=
(24-spaces).toFixed(1);

let remainingWeight=
Math.round(35000-weight);

let over=
spaces>24 ||
weight>35000;

let details="";

trailerStores.forEach(s=>{

details+=`

<div class="storeItem">

<b>${s.NAME}</b><br>

Store # ${s["STORE #"]}<br>

Spaces: ${s.SPACES}<br>

Weight: ${s.WEIGHT}

</div>

`;

});

let route=
"https://www.google.com/maps/dir/" +
trailerStores
.map(
x=>encodeURIComponent(
x.ADDRESS||""
)
)
.join("/");

html+=`

<div class="
trailer
${over?"over":""}
">

<h3>Trailer ${t}</h3>

Stores:
${trailerStores.length}

<br>

Spaces:
${spaces.toFixed(1)}
/24

<br>

Weight:
${Math.round(weight)}
/35000 lbs

<br><br>

Remaining:

<br>

${remainingSpaces}
Spaces

<br>

${remainingWeight}
lbs

<br><br>

${route}

🗺 Open Route

</a>

<hr>

${details}

</div>

`;

}

document
.getElementById("trailers")
.innerHTML=html;

}

function drawAssistant(){

if(stores.length===0){

document.getElementById(
"assistantContent"
).innerHTML=
"Upload a file to begin analysis.";

return;

}
 let largestStore=
[...stores]
.sort(
(a,b)=>
(Number(b.WEIGHT)||0)
-
(Number(a.WEIGHT)||0)
)[0];

let bestTrailer="";
let bestRemaining=-1;

for(let t=1;t<=trailerCount;t++){

let trailerStores=
stores.filter(
s=>s.TRAILER==="Trailer "+t
);

let spaces=0;

trailerStores.forEach(s=>{
spaces+=Number(s.SPACES)||0;
});

let remaining=
24-spaces;

if(remaining>bestRemaining){

bestRemaining=remaining;
bestTrailer="Trailer "+t;

}

}

let suggestion=
stores.find(
s=>s.TRAILER==="Unassigned"
);

document.getElementById(
"assistantContent"
).innerHTML=

`

<div class="assistantGood">

🚛 Best Trailer To Fill

<br>

${bestTrailer}

<br><br>

Remaining Space:
${bestRemaining.toFixed(1)}

</div>

<br>

🏋 Largest Store

<br>

${largestStore.NAME}

<br>

${largestStore.WEIGHT} lbs

<br><br>

📍 Suggested Next Store

<br>

${
suggestion
?
suggestion.NAME
:
"All stores assigned"
}

<br><br>

<div class="assistantWarn">

⚠ Potential Outlier

<br>

${largestStore.NAME}

</div>

`;

}

drawTrailers();
drawAssistant();

</script>

</body>
</html>
